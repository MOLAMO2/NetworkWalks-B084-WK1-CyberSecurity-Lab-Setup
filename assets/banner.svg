<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Cybersecurity Lab banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10233f"/>
      <stop offset="1" stop-color="#1b3a6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <!-- network nodes -->
  <g transform="translate(1200 20) scale(0.6) translate(-1200 0)">
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M900 70 L1010 130 L1120 80"/>
    <path d="M1010 130 L960 230 L1090 220"/>
    <path d="M960 230 L1090 220"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="900" cy="70" r="7"/><circle cx="1120" cy="80" r="7"/>
    <circle cx="960" cy="230" r="7"/><circle cx="1090" cy="220" r="7"/>
  </g>
  <circle cx="1010" cy="130" r="13" fill="#22c55e"/>
  <circle cx="1010" cy="130" r="24" fill="none" stroke="#22c55e" stroke-opacity="0.45" stroke-width="2"/>
  </g>
  <!-- shield -->
  <g transform="translate(70 70)">
    <path d="M60 0 L120 22 V80 C120 124 92 152 60 168 C28 152 0 124 0 80 V22 Z" fill="#0b1220" stroke="url(#accent)" stroke-width="5"/>
    <path d="M38 82 L55 99 L86 62" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="230" y="105" font-size="20" letter-spacing="4" fill="#38bdf8" font-weight="600">NETWORKWALKS CYBERSECURITY TRAINING</text>
    <text x="228" y="168" font-size="50" font-weight="800">Cybersecurity Lab Setup</text>
    <rect x="230" y="184" width="210" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="230" y="226" font-size="21" fill="#cbd5e1">Kali Linux 2026.3  ·  Oracle VirtualBox 7.2.22  ·  NAT Network  ·  Static IPv4</text>
    <text x="230" y="260" font-size="18" fill="#94a3b8">Week 1  ·  Project PM1-Cybersecurity Lab  ·  Batch B084</text>
  </g>
</svg>
